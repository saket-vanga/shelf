<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>Shelf</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#000; --muted:#8e8e93; --sep:#e5e5ea;
  --accent:#c2410c; --accent-soft:#fdeee6; --danger:#ff3b30; --field:#f2f2f7;
  --star:#ff9f0a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#fff; --muted:#8e8e93; --sep:#38383a;
    --accent:#ff8a4c; --accent-soft:#3a2216; --field:#2c2c2e;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- Login ---------- */
#auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.logo{width:76px;height:76px;border-radius:18px;background:var(--accent);margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(194,65,12,.3)}
.logo svg{width:44px;height:44px}
#auth h1{text-align:center;font-size:34px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px}
#auth .sub{text-align:center;color:var(--muted);margin:0 0 28px}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:14px}
.group input,.group textarea{display:block;width:100%;border:0;background:transparent;padding:14px 16px;outline:none}
.group > * + *:not(.hidden){border-top:1px solid var(--sep)}
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-align:center}
.btn:active{opacity:.75}
.link{display:block;margin:18px auto 0;color:var(--accent);font-size:15px}
.err{color:var(--danger);font-size:14px;text-align:center;min-height:20px;margin:0 0 10px}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}

/* ---------- Main ---------- */
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.navbar{display:flex;justify-content:space-between;align-items:center;height:44px}
.navbar button{color:var(--accent);font-size:17px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0 10px}
.search{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:17px}
.search svg{flex:none;opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 22px}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sectionhead{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 16px 6px;letter-spacing:.3px}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:26px}
.row{display:flex;gap:12px;padding:12px 16px;align-items:center;width:100%;text-align:left}
.row + .row{border-top:.5px solid var(--sep)}
.row:active{background:var(--field)}
.cover{flex:none;width:42px;height:58px;border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;box-shadow:inset -3px 0 0 rgba(0,0,0,.15)}
.meta{flex:1;min-width:0}
.meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13px;color:var(--star);letter-spacing:1px}
.date{color:var(--muted);font-size:13px;flex:none}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab:active{transform:scale(.94)}

/* ---------- Sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet .navbar{padding:0 16px;height:52px}
.sheet .navbar h2{font-size:17px;margin:0;font-weight:600}
.sheet .navbar .done{font-weight:600}
.sheet .wrap{padding-top:6px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 16px 6px;letter-spacing:.3px}
.stars{display:flex;justify-content:center;gap:8px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px}
.stars button{font-size:32px;color:var(--sep);line-height:1}
.stars button.on{color:var(--star)}
.group input[type=date]{-webkit-appearance:none;min-height:50px}
textarea{resize:none;min-height:110px}
.del{display:block;width:100%;background:var(--card);border-radius:12px;padding:14px;color:var(--danger);text-align:center;margin-top:10px}
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
#splash .logo{margin:0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6;transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){#splash .logo{animation:none}}
.btn:disabled{opacity:.6}
.del.confirm{background:var(--danger);color:#fff}

/* ---------- Adapt to screen size ---------- */
#auth{max-width:440px}
.row,.fab,.stars button{transition:background .15s,transform .15s}
@media (hover:hover){
  .row:hover{background:var(--field)}
  .fab:hover{transform:scale(1.06)}
  .stars button:hover{transform:scale(1.12)}
}

/* small phones (iPhone SE, mini) */
@media (max-width:359px){
  .big{font-size:30px}
  .stats{gap:8px}
  .stat{padding:10px}
  .stat b{font-size:20px}
  .stat span{font-size:10px}
  .date{display:none}
}

/* phones in landscape: short screens */
@media (max-height:500px) and (orientation:landscape){
  #auth{justify-content:flex-start;padding-top:24px}
  #auth .logo{width:56px;height:56px;margin-bottom:10px}
  #auth h1{font-size:28px}
  .sheet{max-height:100vh;border-radius:0}
}

/* tablets and up: books become a grid of cards, the sheet becomes a centered dialog */
@media (min-width:700px){
  .wrap{max-width:1080px;padding:0 32px}
  .big{font-size:40px;margin:6px 0 14px}
  .nav .wrap{display:grid;grid-template-columns:1fr 340px;grid-template-areas:"bar bar" "title search";align-items:center;column-gap:24px}
  .navbar{grid-area:bar}
  .big{grid-area:title}
  .search{grid-area:search;margin:0}
  .stats{grid-template-columns:repeat(3,minmax(0,220px));gap:14px;margin:14px 0 30px}
  .stat{padding:16px 18px}
  .stat b{font-size:30px}
  .sectionhead{margin-left:4px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;background:none;border-radius:0;overflow:visible;margin-bottom:34px}
  .row{background:var(--card);border-radius:14px;padding:16px}
  .row + .row{border-top:0}
  .cover{width:52px;height:72px;font-size:22px}
  .fab{right:max(32px,env(safe-area-inset-right));bottom:calc(32px + env(safe-area-inset-bottom));width:64px;height:64px}

  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(540px,calc(100vw - 48px));max-height:min(760px,calc(100vh - 48px));border-radius:16px;padding-bottom:20px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--sep)}
  .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .wrap{padding:6px 20px 0}
}

/* large screens */
@media (min-width:1200px){
  .wrap{max-width:1240px}
  .list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .sheet,.backdrop,.row,.fab{transition:none}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="splash"><div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 4.5h6.5c1.4 0 2.5 1.1 2.5 2.5v13c0-1-.8-1.8-1.8-1.8H3zM21 4.5h-6.5C13.1 4.5 12 5.6 12 7v13c0-1 .8-1.8 1.8-1.8H21z"/></svg></div></div>

<section id="auth" class="wrap hidden">
  <div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 4.5h6.5c1.4 0 2.5 1.1 2.5 2.5v13c0-1-.8-1.8-1.8-1.8H3zM21 4.5h-6.5C13.1 4.5 12 5.6 12 7v13c0-1 .8-1.8 1.8-1.8H21z"/></svg></div>
  <h1>Shelf</h1>
  <p class="sub" id="authSub">Sign in to your reading log</p>
  <form id="authForm" autocomplete="on">
    <div class="group">
      <input id="name" name="name" placeholder="Your name" autocomplete="given-name" class="hidden">
      <input id="u" name="email" type="email" placeholder="Email" autocapitalize="none" autocorrect="off" autocomplete="username" required>
      <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password" class="hidden">
    </div>
    <p class="err" id="authErr"></p>
    <button class="btn" id="authBtn" type="submit">Sign In</button>
  </form>
  <button class="link" id="toggleAuth">New here? Create an account</button>
  <p class="note">Your books sync to your account on every device.</p>
</section>

<!-- ============ MAIN ============ -->
<section id="app" class="hidden">
  <div class="nav">
    <div class="wrap">
      <div class="navbar">
        <span style="color:var(--muted);font-size:15px" id="hello"></span>
        <button id="logout">Sign Out</button>
      </div>
      <div class="big">My Books</div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search">
      </label>
    </div>
  </div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
      <div class="stat"><b id="sYear">0</b><span id="sYearLbl">This year</span></div>
      <div class="stat"><b id="sAvg">–</b><span>Avg rating</span></div>
    </div>
    <div id="lists"></div>
  </div>
  <button class="fab" id="addBtn" aria-label="Add book">+</button>
</section>

<!-- ============ ADD / EDIT SHEET ============ -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="navbar">
    <button id="cancel">Cancel</button>
    <h2 id="sheetTitle">Add Book</h2>
    <button class="done" id="save">Save</button>
  </div>
  <div class="wrap">
    <div class="group">
      <input id="fTitle" placeholder="Title" autocapitalize="words">
      <input id="fAuthor" placeholder="Author" autocapitalize="words">
    </div>
    <p class="label">Finished on</p>
    <div class="group"><input id="fDate" type="date"></div>
    <p class="label">Rating</p>
    <div class="stars" id="fStars"></div>
    <p class="label">Notes</p>
    <div class="group"><textarea id="fNotes" placeholder="What did you think?"></textarea></div>
    <p class="err" id="sheetErr"></p>
    <button class="del hidden" id="del">Delete Book</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const show = (el, on) => $(el).classList.toggle('hidden', !on);

/* ---------- Supabase ---------- */
const cfg = window.SHELF_CONFIG || {};
const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes('YOUR_') && cfg.SUPABASE_ANON_KEY && !cfg.SUPABASE_ANON_KEY.includes('YOUR_');
const sb = configured && window.supabase ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

/* ---------- Auth ---------- */
let signup = false, user = null, books = [];

function setMode(s){
  signup = s;
  show('name', s); $('name').required = s;
  show('p2', s); $('p2').required = s;
  $('authBtn').textContent = s ? 'Create Account' : 'Sign In';
  $('authSub').textContent = s ? 'Start tracking what you read' : 'Sign in to your reading log';
  $('toggleAuth').textContent = s ? 'Already have an account? Sign in' : 'New here? Create an account';
  $('p').autocomplete = s ? 'new-password' : 'current-password';
  msg('');
}
function msg(text, ok){ $('authErr').textContent = text; $('authErr').style.color = ok ? 'var(--muted)' : ''; }
$('toggleAuth').onclick = () => setMode(!signup);

$('authForm').onsubmit = async e => {
  e.preventDefault();
  if (!sb) return msg('The app isn\'t connected to its database yet. Add your Supabase keys to config.js.');
  const email = $('u').value.trim(), pw = $('p').value;
  if (signup && pw.length < 6) return msg('Password must be at least 6 characters.');
  if (signup && pw !== $('p2').value) return msg("Passwords don't match.");
  $('authBtn').disabled = true; $('authBtn').textContent = signup ? 'Creating…' : 'Signing in…';
  try {
    if (signup) {
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name: $('name').value.trim() } } });
      if (error) throw error;
      if (!data.session) { setMode(false); $('p').value = ''; return msg('Check your email to confirm your account, then sign in.', true); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    }
  } catch (err) {
    msg(/invalid login/i.test(err.message) ? 'Wrong email or password.' : err.message);
  } finally {
    $('authBtn').disabled = false; $('authBtn').textContent = signup ? 'Create Account' : 'Sign In';
  }
};

$('logout').onclick = () => sb.auth.signOut();

function onSession(session){
  show('splash', false);
  if (session?.user) {
    if (user?.id === session.user.id) return;
    user = session.user;
    $('hello').textContent = 'Hi, ' + (user.user_metadata?.name || user.email.split('@')[0]);
    show('auth', false); show('app', true);
    loadBooks();
  } else {
    user = null; books = [];
    $('authForm').reset(); setMode(false);
    show('app', false); show('auth', true);
  }
}

/* ---------- Books (synced) ---------- */
async function loadBooks(){
  $('lists').innerHTML = '<div class="empty">Loading your books…</div>';
  const { data, error } = await sb.from('books').select('*').order('finished_on', { ascending: false, nullsFirst: false });
  if (error) { $('lists').innerHTML = `<div class="empty"><b>Couldn't load your books</b>${esc(error.message)}<br><br><button class="link" onclick="loadBooks()">Try again</button></div>`; return; }
  books = data; render();
}

const palette = ['#c2410c','#0f766e','#4338ca','#be185d','#15803d','#a16207','#0369a1','#7c3aed'];
const colorFor = s => palette[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % palette.length];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d + 'T00:00').toLocaleDateString(undefined, { month:'short', day:'numeric' });

function render(){
  const all = books;
  const yr = String(new Date().getFullYear());
  const rated = all.filter(b => b.rating);
  $('sTotal').textContent = all.length;
  $('sYear').textContent = all.filter(b => (b.finished_on||'').startsWith(yr)).length;
  $('sYearLbl').textContent = 'In ' + yr;
  $('sAvg').textContent = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) + '★' : '–';

  const q = $('q').value.trim().toLowerCase();
  const list = q ? all.filter(b => [b.title, b.author, b.notes].join(' ').toLowerCase().includes(q)) : all;

  if (!all.length) { $('lists').innerHTML = '<div class="empty"><b>No books yet</b>Tap + after you finish a book to log it.</div>'; return; }
  if (!list.length) { $('lists').innerHTML = '<div class="empty">No matches.</div>'; return; }

  const byYear = {};
  list.forEach(b => (byYear[(b.finished_on||'').slice(0,4) || 'Undated'] ??= []).push(b));
  $('lists').innerHTML = Object.entries(byYear).map(([y, group]) => `
    <p class="sectionhead">${y} · ${group.length} book${group.length>1?'s':''}</p>
    <div class="list">${group.map(b => `
      <button class="row" data-id="${b.id}">
        <div class="cover" style="background:${colorFor(b.title)}">${esc(b.title[0]?.toUpperCase()||'?')}</div>
        <div class="meta">
          <div class="t">${esc(b.title)}</div>
          <div class="a">${esc(b.author || 'Unknown author')}</div>
          ${b.rating ? `<div class="s">${'★'.repeat(b.rating)}</div>` : ''}
        </div>
        ${b.finished_on ? `<span class="date">${fmt(b.finished_on)}</span>` : ''}
      </button>`).join('')}
    </div>`).join('');
}
$('q').oninput = render;
$('lists').onclick = e => { const r = e.target.closest('.row'); if (r) openSheet(r.dataset.id); };

/* ---------- Sheet ---------- */
let editing = null, rating = 0, busy = false;
$('fStars').innerHTML = [1,2,3,4,5].map(n => `<button data-n="${n}" aria-label="${n} stars">★</button>`).join('');
$('fStars').onclick = e => { const n = +e.target.dataset.n; if (n) { rating = rating === n ? 0 : n; paintStars(); } };
const paintStars = () => [...$('fStars').children].forEach((b,i) => b.classList.toggle('on', i < rating));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

function openSheet(id){
  const b = id ? books.find(x => x.id === id) : null;
  editing = b ? b.id : null;
  $('sheetTitle').textContent = b ? 'Edit Book' : 'Add Book';
  $('fTitle').value = b?.title || '';
  $('fAuthor').value = b?.author || '';
  $('fDate').value = b?.finished_on || today();
  $('fNotes').value = b?.notes || '';
  rating = b?.rating || 0; paintStars();
  show('del', !!b); $('del').classList.remove('confirm'); $('del').textContent = 'Delete Book';
  $('sheetErr').textContent = '';
  $('sheet').classList.add('open'); $('backdrop').classList.add('open');
  if (!b) setTimeout(() => $('fTitle').focus(), 320);
}
function closeSheet(){ $('sheet').classList.remove('open'); $('backdrop').classList.remove('open'); document.activeElement.blur(); }

$('addBtn').onclick = () => openSheet();
$('cancel').onclick = $('backdrop').onclick = closeSheet;

$('save').onclick = async () => {
  if (busy) return;
  const title = $('fTitle').value.trim();
  if (!title) { $('fTitle').focus(); $('fTitle').placeholder = 'Title is required'; return; }
  const row = { title, author: $('fAuthor').value.trim(), finished_on: $('fDate').value || null, rating: rating || null, notes: $('fNotes').value.trim() };
  busy = true; $('save').textContent = 'Saving…';
  const { data, error } = editing
    ? await sb.from('books').update(row).eq('id', editing).select().single()
    : await sb.from('books').insert(row).select().single();
  busy = false; $('save').textContent = 'Save';
  if (error) { $('sheetErr').textContent = "Couldn't save: " + error.message; return; }
  books = editing ? books.map(b => b.id === editing ? data : b) : [data, ...books];
  books.sort((a,b) => (b.finished_on||'').localeCompare(a.finished_on||''));
  closeSheet(); render();
};

$('del').onclick = async () => {
  const d = $('del');
  if (!d.classList.contains('confirm')) { d.classList.add('confirm'); d.textContent = 'Tap again to delete'; return; }
  d.textContent = 'Deleting…';
  const { error } = await sb.from('books').delete().eq('id', editing);
  if (error) { $('sheetErr').textContent = "Couldn't delete: " + error.message; d.textContent = 'Delete Book'; d.classList.remove('confirm'); return; }
  books = books.filter(b => b.id !== editing); closeSheet(); render();
};

/* ---------- Boot ---------- */
if (sb) {
  sb.auth.onAuthStateChange((_event, session) => onSession(session));
  // refresh when the app comes back to the foreground, so books added on another device show up
  document.addEventListener('visibilitychange', () => { if (!document.hidden && user) loadBooks(); });
} else {
  onSession(null);
  msg('Not connected yet: add your Supabase keys to config.js.');
}
